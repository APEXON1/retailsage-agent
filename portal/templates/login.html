<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 智能问答门户</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">◆</div>
        <div>
          <div class="brand-text">智能问答门户</div>
          <div class="brand-sub">统一入口 · 多知识库</div>
        </div>
      </div>

      <h1 class="auth-title">登录</h1>
      <p class="auth-sub">登录后可进入全部问答应用，各账号数据相互隔离。</p>

      {% if error %}
      <div class="alert"><span>⚠</span><span>{{ error }}</span></div>
      {% endif %}

      <form method="post" action="/login" autocomplete="on">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="identifier">账号</label>
          <input id="identifier" name="identifier" type="text" value="{{ identifier }}"
                 placeholder="邮箱，或旧账号如 hr03" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password"
                 placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">登录</button>
      </form>

      <div class="auth-foot">
        还没有账号？注册与找回密码在「智能 HR 知识库」应用的登录页内完成。<br>
        <strong>演示账号</strong>：demo@demo.local / demo123456
      </div>
    </div>
  </div>
</body>
</html>
